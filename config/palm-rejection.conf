# omarchy-dtp-palm-rejection settings.
#
# The daemon reloads this file as soon as it is saved. Change it with
# `omarchy-dtp-palm-rejection set <key> <value>`, or edit it directly; it is
# writable by the wheel group. Bad lines are reported in the journal and
# skipped, keeping that setting's default.

# yes: filter palms. no: the trackpad goes straight to libinput as stock.
enabled = yes

# yes: log every touch's measurements and decision to the journal.
# `omarchy-dtp-palm-rejection monitor` turns this on while it runs.
debug = no

# Sizes are the trackpad's raw ABS_MT_TOUCH_MAJOR units. Use `monitor` to see
# what your fingertips and palms measure, then tune these.

# A touch this big is a palm, typing or not, until it lifts.
palm_size = 1600

# Bigger than this is a palm while typing or when it rests in an edge zone.
# Fingertips measured up to about 770 on an M2 MacBook Pro, palms 1000 and up.
finger_size = 1000

# How long after a typing key press counts as typing.
typing_ms = 500

# A new touch this soon after a key is held back until it moves
# center_release_mm, so a brushing palm cannot tap-click.
tap_guard_ms = 250

# Keep checking a new touch's size for this long while it lands and spreads.
settle_ms = 60

# Edge zones where palms rest while typing, in mm: the left and right sides,
# and the front edge (the one away from the keyboard).
side_edge_mm = 12
bottom_edge_mm = 10

# Travel that turns a held-back touch into a finger: an edge touch once typing
# has stopped, and a tap-guarded touch in the middle.
edge_release_mm = 8
center_release_mm = 1.5

# A touch that has moved less than this is resting; one that moved more is
# trusted as a finger.
rest_mm = 2

# Leave empty to detect the built-in trackpad and keyboard. Set to a device
# name from `omarchy-dtp-palm-rejection devices` to pick one.
touchpad_name =
keyboard_name =
